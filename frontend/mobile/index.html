<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark" class="liz-auth-gate">
<head>
  <!-- Auth guard: valida a sessão Firebase antes de liberar o chat.
       Quem abre a URL sem login é redirecionado para a tela de login. -->
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/auth-guard.js"></script>

  <style>
    /* Gate de autenticação: esconde o app até a sessão Firebase
       ser confirmada (auth-guard.js remove a classe do <html>). */
    html.liz-auth-gate .app { display: none; }
  </style>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Liz — sua assistente com inteligência artificial." />
  <title>Liz</title>
  <link rel="icon" type="image/svg+xml" href="../coroa.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css?v=20260814" />
  <link rel="stylesheet" href="css/chat.css" />
  <link rel="stylesheet" href="css/panels.css?v=20260815" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="../css/mural.css" />
</head>
<body>
  <div class="app">

    <!-- ===================================================
         SVGs DECORATIVOS — formas geométricas flutuantes
         (mesma linguagem visual do desktop)
    ==================================================== -->
    <svg class="bg-deco" viewBox="0 0 390 844" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"
         style="position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:0.5">
      <polygon class="deco-hex" points="320,80 355,100 355,140 320,160 285,140 285,100"
               fill="none" stroke="rgba(139,92,246,0.06)" stroke-width="1"/>
      <circle cx="60" cy="700" r="25" fill="none" stroke="rgba(139,92,246,0.05)" stroke-width="1"/>
      <polygon points="340,650 355,680 325,680" fill="none" stroke="rgba(139,92,246,0.04)" stroke-width="1"/>
      <rect x="40" y="180" width="18" height="18" rx="3" transform="rotate(45 49 189)"
            fill="none" stroke="rgba(139,92,246,0.04)" stroke-width="1"/>
    </svg>

    <!-- Header — coroa maior que abre o menu -->
    <header class="header">
      <button class="header-crown-btn" id="crownToggle" aria-label="Mostrar menu">
        <span class="header-crown-liz" id="hc"></span>
      </button>
      <button class="header-back" id="backBtn" aria-label="Voltar" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <span class="header-title" id="ht">Liz</span>
      <span class="header-sep" id="hSep" style="display:none">·</span>
      <span class="header-sub" id="hSub"></span>
      <div class="header-right">
        <button class="theme-toggle" id="tb" type="button" aria-label="Ativar modo claro" title="Modo claro">
          <span class="theme-toggle-track">
            <span class="theme-toggle-thumb" style="transform: translateX(0px) rotate(0deg);">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
              </svg>
            </span>
          </span>
        </button>
      </div>
    </header>

    <!-- Dock de navegação — flutuante, vidro -->
    <div class="tools-bar">
      <button class="tool-pill" data-t="newchat" aria-label="Novo chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
      <button class="tool-pill is-active" data-t="chat" aria-label="Chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></button>
      <button class="tool-pill" data-t="archive" aria-label="Arquivo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></button>
      <button class="tool-pill" data-t="settings" aria-label="Ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
      <button class="tool-pill" data-t="account" aria-label="Conta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></button>
    </div>

    <!-- Pages -->
    <main class="main">

      <div class="page is-active" id="pChat">
        <div class="chat-page">
          <div class="chat-content" id="chatContent">
            <div class="empty" id="empty">
              <div class="empty-crown" id="ec"></div>
              <h2 class="empty-t">Liz</h2>
              <p class="empty-s">Como posso te ajudar?</p>
            </div>
            <div class="msg-list is-hidden" id="ml"></div>
          </div>
          <div class="composer-wrap composer-fixed">
            <form class="composer" id="cf">
              <div class="composer-row">
                <textarea class="composer-input" id="ci" rows="1" placeholder="O que você precisa?" aria-label="Mensagem"></textarea>
              </div>
              <div class="composer-actions">
                <button class="composer-attach" id="ab" type="button" aria-label="Anexar arquivo" title="Enviar arquivo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg></button>
                <button class="composer-search-toggle" id="wsb" type="button" aria-pressed="false" aria-label="Pesquisa na web" title="Pesquisa na web"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
                <div class="composer-spacer"></div>
                <button class="composer-send" id="sb" type="submit" disabled aria-label="Enviar mensagem" title="Enviar mensagem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <div class="page" id="pSettings"></div>
    </main>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal" id="modal">
        <div class="modal-head">
          <h3 class="modal-title" id="modalTitle">Título</h3>
          <button class="modal-close" id="modalClose"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
        </div>
        <div class="modal-body" id="modalBody"></div>
      </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- File input -->
    <input type="file" id="fi" hidden multiple>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui-core.js"></script>
  <script src="../js/mural.js"></script>
  <script src="js/mobile.js"></script>
</body>
</html>
